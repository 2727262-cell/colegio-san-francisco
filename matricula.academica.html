    <section class="Matrícula">


    <div class="matricula-formulario" id="formulario-matricula">


        <h3>Solicitud de matrícula</h3>


        <form id="formMatricula">


            <label>Nombre del estudiante</label>
            <input type="text" placeholder="Nombre completo" required>


            <label>Fecha de nacimiento</label>
            <input type="date" required>


            <label>Nombre del encargado</label>
            <input type="text" placeholder="Nombre del padre o encargado" required>


            <label>Teléfono de contacto</label>
            <input type="tel" placeholder="Número de teléfono" required>


            <label>Grado que desea cursar</label>
            <select required>
                <option value="">Seleccione un grado</option>
                <option>Educación Inicial</option>
                <option>Preescolar</option>
                <option>Primer grado</option>
                <option>Segundo grado</option>
                <option>Tercer grado</option>
                <option>Cuarto grado</option>
                <option>Quinto grado</option>
                <option>Sexto grado</option>
            </select>


            <button type="submit" class="btn-enviar">
                Enviar solicitud
            </button>


            <p id="mensajeMatricula"></p>


        </form>


    </div>


</section>
